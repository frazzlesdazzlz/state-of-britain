name: Update State of Britain
on:
  schedule:
    - cron: "35 8 * * 1-5"
    - cron: "5 11 * * 1-5"
    - cron: "5 16 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/update.py
      - name: Commit check
        run: |
          git config user.name "state-of-britain-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.json data/history.json
          git diff --cached --quiet || git commit -m "Update dashboard check"
          git push
