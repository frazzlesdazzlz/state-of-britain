name: Update State of Britain
on:
  schedule:
    # UTC times; UK local time shifts by one hour at daylight saving changes.
    # Do not reject delayed GitHub jobs based on their start minute.
    - cron: "5 8,11,16 * * 1-5"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update.yml"
permissions:
  contents: write
concurrency:
  group: update-state-of-britain
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Update data
        run: python scripts/update.py
      - name: Commit check
        run: |
          git config user.name "state-of-britain-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.json data/history.json
          git diff --cached --quiet || git commit -m "Update dashboard check"
          git push
